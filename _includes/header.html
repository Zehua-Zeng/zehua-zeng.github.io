{% assign current = page.url | downcase | split: '/' %}
<header class="page-header">
  <nav class="container">
    <a class="site-title" href="{{ absolute_url }}/">{{ site.title }}</a>

    <a href="{{ '/projects/' | relative_url }}" {% if current[1] == "projects" %}aria-current="page"{% endif %}>Projects</a>
    <a href="{{ '/cv/' | relative_url }}" {% if current[1] == "cv" %}aria-current="page"{% endif %}>CV</a>

    <span class="external">
      {%- for platform in site.sidebar-external %}
      <a href="{{ platform.link | relative_url }}">{{ platform.icon }}</a>
      &nbsp; {%- endfor %}
    </span>
  </nav>
</header>
